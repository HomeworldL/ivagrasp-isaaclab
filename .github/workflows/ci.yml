name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lightweight-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install pytest==9.0.3 numpy==1.26.0
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check Python syntax
        run: python -m compileall -q source scripts tests
      - name: Run simulator-free tests
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=source python -m pytest -q
          tests/test_object_assignment.py tests/test_mdp_core.py tests/test_moving_speed_curriculum.py
